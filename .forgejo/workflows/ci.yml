name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/jorge-lavin/rss-studio

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOMODCACHE: ${{ github.workspace }}/.go/pkg/mod
      GOCACHE: ${{ github.workspace }}/.go/build-cache
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure GHCR credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_USERNAME: jorge-lavin
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          mkdir -p .docker
          auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > .docker/config.json

      - name: Build image
        uses: docker://docker.io/martizih/kaniko:v1.28.6@sha256:2fa20b0a4b40c7db72b479d57e55c2cf79f2178533b2d3bcbd129d6bd3c087ed
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
          KANIKO_NO_PUSH: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        with:
          args: >-
            --context=dir://${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Dockerfile
            --destination=${{ env.IMAGE }}:${{ github.sha }}
            --build-arg=VERSION=${{ github.sha }}
            --label=org.opencontainers.image.revision=${{ github.sha }}
            --no-push-cache

  release:
    runs-on: ubuntu-latest
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Bootstrap initial release
        id: bootstrap
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Forgejo workflow token is unavailable" >&2
            exit 1
          fi

          git fetch --tags
          if git tag --list 'v*' | grep -q .; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          version=0.1.0
          api_url="${GITHUB_API_URL%/}"
          server_url="${GITHUB_SERVER_URL%/}"
          if [[ "$api_url" != "$server_url/api/v1" ]]; then
            echo "Unexpected Forgejo API endpoint" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected commit SHA" >&2
            exit 1
          fi
          if [[ ! "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "Unexpected repository name" >&2
            exit 1
          fi
          payload=$(printf \
            '{"tag_name":"v%s","target_commitish":"%s","name":"v%s","body":"Initial release of RSS Studio.","draft":false,"prerelease":false}' \
            "$version" "$GITHUB_SHA" "$version")

          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H 'Content-Type: application/json' \
            "$api_url/repos/$GITHUB_REPOSITORY/releases" \
            --data "$payload"

          echo "created=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_SERVER_URL: ${{ github.server_url }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0 # exact Node.js version required by semantic-release 25.0.3

      - name: Install release tooling
        if: steps.bootstrap.outputs.created != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run semantic release
        if: steps.bootstrap.outputs.created != 'true'
        run: ./node_modules/.bin/semantic-release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}

      - name: Determine released version
        id: version
        env:
          BOOTSTRAPPED: ${{ steps.bootstrap.outputs.created }}
        run: |
          set -euo pipefail

          if [[ "$BOOTSTRAPPED" == true ]]; then
            echo "version=0.1.0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags
          tag=$(git tag --points-at "$GITHUB_SHA" --list 'v*' | sort -V | tail -n 1)
          if [[ -n "$tag" ]]; then
            version=${tag#v}
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Unsupported release tag: $tag" >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure release image credentials
        if: steps.version.outputs.version != ''
        env:
          GHCR_USERNAME: jorge-lavin
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          mkdir -p .docker
          auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$auth" > .docker/config.json

      - name: Publish release image
        if: steps.version.outputs.version != ''
        uses: docker://docker.io/martizih/kaniko:v1.28.6@sha256:2fa20b0a4b40c7db72b479d57e55c2cf79f2178533b2d3bcbd129d6bd3c087ed
        env:
          DOCKER_CONFIG: ${{ github.workspace }}/.docker
        with:
          args: >-
            --context=dir://${{ github.workspace }}
            --dockerfile=${{ github.workspace }}/Dockerfile
            --destination=${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            --destination=${{ env.IMAGE }}:latest
            --build-arg=VERSION=${{ steps.version.outputs.version }}
            --label=org.opencontainers.image.version=${{ steps.version.outputs.version }}
            --label=org.opencontainers.image.revision=${{ github.sha }}
            --no-push-cache

  deploy:
    runs-on: ubuntu-latest
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.version != ''
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy release image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported deployment version: $VERSION" >&2
            exit 1
          fi

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$VERSION'" <<'REMOTE'
          set -euo pipefail

          version=$1
          compose_file=/home/deploy/rss-studio/compose.yaml
          image_prefix=ghcr.io/jorge-lavin/rss-studio
          volume_repair_image=alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
          version_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          previous_container=$(docker ps -aq \
            --filter label=com.docker.compose.service=rss-studio | sed -n '1p')
          if [[ -z "$previous_container" ]]; then
            echo "Cannot deploy safely: no existing rss-studio container to restore" >&2
            exit 1
          fi

          previous_image=$(docker inspect --format '{{.Config.Image}}' "$previous_container")
          case "$previous_image" in
            "$image_prefix":*) previous_version=${previous_image#"$image_prefix":} ;;
            *)
              echo "Cannot deploy safely: current image is not a release tag: $previous_image" >&2
              exit 1
              ;;
          esac
          if [[ ! "$previous_version" =~ $version_pattern ]]; then
            echo "Cannot deploy safely: current image has unsupported tag: $previous_version" >&2
            exit 1
          fi

          data_mount=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Type}}:{{.Name}}{{end}}{{end}}' "$previous_container")
          if [[ "$data_mount" != volume:* ]]; then
            echo "Cannot deploy safely: rss-studio /data mount is not a named volume" >&2
            exit 1
          fi
          data_volume=${data_mount#volume:}
          if [[ ! "$data_volume" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "Cannot deploy safely: invalid rss-studio data volume name" >&2
            exit 1
          fi

          service_container() {
            docker ps -q --filter label=com.docker.compose.service=rss-studio | sed -n '1p'
          }

          image_owner() {
            local image=$1
            local owner
            owner=$(docker image inspect --format '{{.Config.User}}' "$image")
            if [[ -z "$owner" ]]; then
              owner=0:0
            elif [[ "$owner" =~ ^[0-9]+$ ]]; then
              owner="$owner:$owner"
            fi
            if [[ ! "$owner" =~ ^[0-9]+:[0-9]+$ ]]; then
              echo "Cannot deploy safely: image has non-numeric runtime user: $owner" >&2
              return 1
            fi
            printf '%s\n' "$owner"
          }

          repair_volume() {
            local image=$1
            local owner
            owner=$(image_owner "$image") || return 1
            docker run --rm --pull=missing --user 0:0 \
              --mount "type=volume,source=$data_volume,target=/data" \
              "$volume_repair_image" chown -R "$owner" /data
          }

          wait_for_ready() {
            local container
            for _ in {1..60}; do
              container=$(service_container)
              if [[ -n "$container" ]]; then
                if docker run --rm --pull=missing --network rss-proxy \
                  "$volume_repair_image" wget -q -O /dev/null --timeout=2 \
                  http://rss-studio:8080/health; then
                  return 0
                fi
              fi
              sleep 1
            done
            return 1
          }

          rollback_required=false
          rollback() {
            local status=$?
            trap - EXIT
            if [[ "$rollback_required" == true && "$status" -ne 0 ]]; then
              echo "Deployment failed; restoring rss-studio:$previous_version" >&2
              rollback_ok=true
              if ! RSS_STUDIO_TAG="$previous_version" docker compose -f "$compose_file" pull rss-studio; then
                rollback_ok=false
              fi
              if ! RSS_STUDIO_TAG="$previous_version" docker compose -f "$compose_file" stop rss-studio; then
                rollback_ok=false
              fi
              if ! repair_volume "$image_prefix:$previous_version"; then
                rollback_ok=false
              fi
              if ! RSS_STUDIO_TAG="$previous_version" docker compose -f "$compose_file" up -d --no-build rss-studio; then
                rollback_ok=false
              fi
              if ! wait_for_ready; then
                rollback_ok=false
              fi
              if [[ "$rollback_ok" != true ]]; then
                echo "Automatic rollback failed" >&2
                exit 1
              fi
              echo "Automatic rollback completed" >&2
            fi
            exit "$status"
          }
          trap rollback EXIT

          rollback_required=true
          RSS_STUDIO_TAG="$version" docker compose -f "$compose_file" pull rss-studio
          RSS_STUDIO_TAG="$version" docker compose -f "$compose_file" stop rss-studio
          repair_volume "$image_prefix:$version"
          RSS_STUDIO_TAG="$version" docker compose -f "$compose_file" up -d --no-build rss-studio
          current_container=$(service_container)
          current_image=$(docker inspect --format '{{.Config.Image}}' "$current_container")
          [[ "$current_image" == "$image_prefix:$version" ]]
          wait_for_ready

          rollback_required=false
          trap - EXIT
          REMOTE
