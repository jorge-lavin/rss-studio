name: Roll back production

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact existing image version, without the v prefix (for example, 0.1.0)
        required: true
        type: string

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate target version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported rollback version: $VERSION" >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy selected image
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unsupported rollback version: $VERSION" >&2
            exit 1
          fi

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -s -- '$VERSION'" <<'REMOTE'
          set -euo pipefail

          version=$1
          compose_file=/home/deploy/rss-studio/compose.yaml
          image_prefix=ghcr.io/jorge-lavin/rss-studio
          volume_repair_image=alpine@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f

          current_container=$(docker ps -aq \
            --filter label=com.docker.compose.service=rss-studio | sed -n '1p')
          if [[ -z "$current_container" ]]; then
            echo "Cannot roll back safely: no existing rss-studio container" >&2
            exit 1
          fi

          data_mount=$(docker inspect --format '{{range .Mounts}}{{if eq .Destination "/data"}}{{.Type}}:{{.Name}}{{end}}{{end}}' "$current_container")
          if [[ "$data_mount" != volume:* ]]; then
            echo "Cannot roll back safely: rss-studio /data mount is not a named volume" >&2
            exit 1
          fi
          data_volume=${data_mount#volume:}
          if [[ ! "$data_volume" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]]; then
            echo "Cannot roll back safely: invalid rss-studio data volume name" >&2
            exit 1
          fi

          target_image="$image_prefix:$version"
          RSS_STUDIO_TAG="$version" docker compose -f "$compose_file" pull rss-studio
          owner=$(docker image inspect --format '{{.Config.User}}' "$target_image")
          if [[ -z "$owner" ]]; then
            owner=0:0
          elif [[ "$owner" =~ ^[0-9]+$ ]]; then
            owner="$owner:$owner"
          fi
          if [[ ! "$owner" =~ ^[0-9]+:[0-9]+$ ]]; then
            echo "Cannot roll back safely: image has non-numeric runtime user: $owner" >&2
            exit 1
          fi

          RSS_STUDIO_TAG="$version" docker compose -f "$compose_file" stop rss-studio
          docker run --rm --pull=missing --user 0:0 \
            --mount "type=volume,source=$data_volume,target=/data" \
            "$volume_repair_image" chown -R "$owner" /data
          RSS_STUDIO_TAG="$version" docker compose -f "$compose_file" up -d --no-build rss-studio
          current_service=$(docker ps -q --filter label=com.docker.compose.service=rss-studio | sed -n '1p')
          current_image=$(docker inspect --format '{{.Config.Image}}' "$current_service")
          [[ "$current_image" == "$target_image" ]]

          for _ in {1..60}; do
            if docker run --rm --pull=missing --network rss-proxy \
              "$volume_repair_image" wget -q -O /dev/null --timeout=2 \
              http://rss-studio:8080/health; then
              exit 0
            fi
            sleep 1
          done
          echo "Rollback readiness check failed" >&2
          exit 1
          REMOTE
