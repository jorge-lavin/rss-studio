services:
  rss-studio:
    build: .
    ports:
      - "8080:8080"
    environment:
      RSS_STUDIO_ADDRESS: ${RSS_STUDIO_ADDRESS:-:8080}
      RSS_STUDIO_DATA: ${RSS_STUDIO_DATA:-/data}
      RSS_STUDIO_DB: ${RSS_STUDIO_DB:-}
      RSS_STUDIO_MCP_ENABLED: ${RSS_STUDIO_MCP_ENABLED:-true}
      RSS_STUDIO_MAX_FEEDS_PER_ACCOUNT: ${RSS_STUDIO_MAX_FEEDS_PER_ACCOUNT:-}
      RSS_STUDIO_PREVIEWS_PER_DAY: ${RSS_STUDIO_PREVIEWS_PER_DAY:-}
      RSS_STUDIO_CREATIONS_PER_DAY: ${RSS_STUDIO_CREATIONS_PER_DAY:-}
      RSS_STUDIO_SPLITS_PER_DAY: ${RSS_STUDIO_SPLITS_PER_DAY:-}
      RSS_STUDIO_MAX_CONCURRENT_EXPENSIVE_OPERATIONS: ${RSS_STUDIO_MAX_CONCURRENT_EXPENSIVE_OPERATIONS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-rss-studio}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-}
    volumes:
      - rss-studio-data:/data
    restart: unless-stopped

volumes:
  rss-studio-data:
